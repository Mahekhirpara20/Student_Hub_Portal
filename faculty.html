<!DOCTYPE html>
<html>
<head>
    <title>Canvas Rectangle</title>
</head>
<body>

    <canvas id="myCanvas"
            width="500"
            height="300"
            style="border:1px solid black;">
    </canvas>

    <script>
        let canvas = document.getElementById("myCanvas");
        let ctx = canvas.getContext("2d");

        ctx.fillRect(100, 80, 200, 100);
    </script>

</body>
</html>
