<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Login</title>
</head>

<body bgcolor="#F5F7FB">

<center>

<br><br><br>

<h1>StudentHub</h1>

<p>Sign in to your portal</p>

<br>

<form action="index.html" method="get">

<fieldset style="width:350px;">

<legend><b>Login</b></legend>

<table cellpadding="10">

<tr>
    <td><b>Student ID</b></td>
</tr>

<tr>
    <td>
        <input type="text"
               name="studentid"
               placeholder="e.g. 25CS033"
               size="35"
               required>
    </td>
</tr>

<tr>
    <td><b>Password</b></td>
</tr>

<tr>
    <td>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               size="35"
               required>
    </td>
</tr>

<tr>
    <td align="center">
        <br>
        <input type="submit" value="Sign In">
    </td>
</tr>

</table>

</fieldset>

</form>

<br>

<hr width="40%">

<p>© 2026 StudentHub Portal</p>

</center>

</body>
</html>
