<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out</title>
    <style>
        :root {
            --bg: #eef4ff;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #475569;
            --primary: #3f5ae0;
            --surface-2: #f8fbff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #dbe7ff 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .page-shell {
            width: min(100%, 420px);
        }
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            padding: 38px 30px;
            text-align: center;
        }
        .brand h1 {
            margin-bottom: 10px;
            font-size: 2.2rem;
            letter-spacing: 0.12em;
            color: #0f172a;
        }
        h2 {
            margin: 22px 0 10px;
            font-size: 1.5rem;
            color: #334155;
        }
        p {
            margin: 0;
            line-height: 1.7;
            color: var(--muted);
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 28px 0;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 14px 20px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .button:hover {
            transform: translateY(-1px);
        }
        .cancel {
            background: var(--surface-2);
            color: #0f172a;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
        .signout {
            background: var(--primary);
            color: #ffffff;
        }
        .footer {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <section class="card">
            <div class="brand">
                <h1>StudentHub</h1>
            </div>
            <h2>Sign Out</h2>
            <p>Are you sure you want to sign out?</p>
            <div class="actions">
                <a class="button cancel" href="index.html">Cancel</a>
                <a class="button signout" href="signout.php">Sign Out</a>
            </div>
            <p class="footer">© 2026 StudentHub Portal</p>
        </section>
    </div>
</body>
</html>
